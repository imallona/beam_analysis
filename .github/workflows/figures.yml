name: figures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      beam_ref:
        description: beam tag or commit to install
        default: v0.3.0

jobs:
  figures:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/figures-r.yml
          cache-environment: true

      - name: Install Graphviz
        run: sudo apt-get install -y --no-install-recommends graphviz

      - name: Install beam and rbeam at the pinned ref
        run: |
          make setup r-setup BEAM_REF="${{ github.event.inputs.beam_ref || 'v0.3.0' }}" PY="$CONDA_PREFIX/bin/python"

      - name: Lint and parse
        run: make check PY="$CONDA_PREFIX/bin/python"

      - name: Numbers
        run: make numbers PY="$CONDA_PREFIX/bin/python"

      - name: Numbers unchanged
        run: git diff --exit-code results/numbers.json

      - name: Figures
        run: |
          make figures PY="$CONDA_PREFIX/bin/python"
          make figure1

      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            figures_r/*.pdf
            figures_r/*.png
            figure1/fig1_design.pdf
            results/numbers.json
          if-no-files-found: error
